# Decap-format configuration, read by Sveltia CMS (drop-in compatible).
#
# Field names must match the nesting in content/site.json exactly, and the
# data-cms attributes in index.html must match both. A mismatch fails silently.
# See CMS_SETUP.md.
backend:
  name: github
  repo: Tonyponyrin/demo-company-page
  branch: main
  # OAuth relay. GitHub Pages cannot host the callback, so authentication goes
  # through this worker (source: github.com/sveltia/sveltia-cms-auth).
  base_url: https://sveltia-cms-auth.infition.workers.dev

# Commits land straight on main and GitHub Pages redeploys.
# Switch to editorial_workflow if you want draft/review pull requests instead.
publish_mode: simple

site_url: https://tonyponyrin.github.io/demo-company-page/
display_url: https://tonyponyrin.github.io/demo-company-page/

media_folder: assets/images
# Must be an absolute path. The site is served from a repository subpath, so
# this is the live URL prefix; cms.js maps it back to a relative path.
public_folder: /demo-company-page/assets/images

locale: en

i18n:
  structure: single_file
  locales: [th, en, zh]
  default_locale: th

collections:
  # Sections are ordered the way they appear on the page, with the menu, the
  # quotation form settings, and page settings last.
  - name: site
    label: Page Text
    label_singular: Page Text
    icon: article
    editor: { preview: false }
    i18n: true
    files:
      - name: content
        label: All page text
        file: content/site.json
        i18n: true
        description: >-
          Every heading, paragraph, and button label on the page. Each field has
          a tab per language: Thai, English, Chinese. Saving publishes the site.
        fields:
          - name: hero
            label: 1. Hero (top of page)
            widget: object
            i18n: true
            fields:
              - name: eyebrow
                label: Small line above the headline
                widget: string
                i18n: true
                required: true
                hint: Short and wide, e.g. "Concrete products & construction".
              - name: headline
                label: Main headline
                widget: text
                i18n: true
                required: true
                hint: The largest text on the page. One sentence works best.
              - name: copy
                label: Intro paragraph
                widget: text
                i18n: true
                required: true
              - name: primaryCta
                label: Orange button
                widget: string
                i18n: true
                required: true
                hint: Opens the quotation form. Two or three words.
              - name: secondaryCta
                label: Outline button
                widget: string
                i18n: true
                required: true
                hint: Jumps to the Products section.
              - name: slide1Image
                label: Slide 1 photo
                widget: image
                i18n: duplicate
                hint: Wide photo, about 1600px across. Keep under 500KB.
              - { name: slide1Alt, label: Slide 1 photo description, widget: string, i18n: true }
              - name: slide2Image
                label: Slide 2 photo
                widget: image
                i18n: duplicate
              - { name: slide2Alt, label: Slide 2 photo description, widget: string, i18n: true }
              - name: slide3Image
                label: Slide 3 photo
                widget: image
                i18n: duplicate
              - { name: slide3Alt, label: Slide 3 photo description, widget: string, i18n: true }

          - name: gallery
            label: 2. Recent work strip
            widget: object
            i18n: true
            collapsed: true
            description: The sliding cards come from the Our Works collection.
            fields:
              - { name: kicker, label: Small label above the heading, widget: string, i18n: true }
              - { name: title, label: Section heading, widget: text, i18n: true, required: true }

          - name: about
            label: 3. About us
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { name: kicker, label: Small label above the heading, widget: string, i18n: true }
              - { name: title, label: Section heading, widget: text, i18n: true, required: true }
              - name: slide1Image
                label: Slideshow photo 1
                widget: image
                i18n: duplicate
              - { name: slide1Alt, label: Photo 1 description, widget: string, i18n: true }
              - name: slide2Image
                label: Slideshow photo 2
                widget: image
                i18n: duplicate
              - { name: slide2Alt, label: Photo 2 description, widget: string, i18n: true }
              - name: experienceValue
                label: Big number
                widget: string
                i18n: duplicate
                hint: 'Shown very large, e.g. "30+".'
              - { name: experienceLabel, label: Caption under the big number, widget: string, i18n: true }
              - name: slogan
                label: Company slogan
                widget: text
                i18n: true
                hint: Shown as a quote beside the big number.

          - name: history
            label: 4. Our history
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { name: kicker, label: Small label above the heading, widget: string, i18n: true }
              - { name: title, label: Section heading, widget: text, i18n: true, required: true }
              - { name: body1, label: First paragraph, widget: text, i18n: true }
              - { name: body2, label: Second paragraph, widget: text, i18n: true }
              - name: slide1Image
                label: Slideshow photo 1
                widget: image
                i18n: duplicate
              - { name: slide1Alt, label: Photo 1 description, widget: string, i18n: true }
              - name: slide2Image
                label: Slideshow photo 2
                widget: image
                i18n: duplicate
              - { name: slide2Alt, label: Photo 2 description, widget: string, i18n: true }

          - name: vision
            label: 5. Vision & mission
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { name: kicker, label: Small label above the heading, widget: string, i18n: true }
              - { name: title, label: Section heading, widget: text, i18n: true, required: true }
              - { name: visionTitle, label: Left card title, widget: string, i18n: true, required: true }
              - { name: visionBody, label: Left card text, widget: text, i18n: true }
              - { name: missionTitle, label: Right card title, widget: string, i18n: true, required: true }
              - { name: missionBody, label: Right card text, widget: text, i18n: true }

          - name: policy
            label: 6. Our policy
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { name: kicker, label: Small label above the heading, widget: string, i18n: true }
              - { name: title, label: Section heading, widget: text, i18n: true, required: true }
              - name: point1
                label: Policy point 1
                widget: text
                i18n: true
                hint: Shown as a ticked list. One sentence each.
              - { name: point2, label: Policy point 2, widget: text, i18n: true }
              - { name: point3, label: Policy point 3, widget: text, i18n: true }
              - { name: point4, label: Policy point 4, widget: text, i18n: true }
              - name: image
                label: Section photo
                widget: image
                i18n: duplicate
              - { name: imageAlt, label: Photo description, widget: string, i18n: true }

          - name: products
            label: 7. Products heading
            widget: object
            i18n: true
            collapsed: true
            description: >-
              The heading above the six product cards on the home page. The cards
              themselves are edited under Products.
            fields:
              - { name: kicker, label: Small label above the heading, widget: string, i18n: true }
              - { name: title, label: Section heading, widget: text, i18n: true, required: true }
              - { name: lead, label: Intro line under the heading, widget: text, i18n: true }

          - name: builders
            label: 8. Singhawat Builders
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { name: kicker, label: Small label above the heading, widget: string, i18n: true }
              - { name: title, label: Section heading, widget: text, i18n: true, required: true }
              - { name: body, label: Body paragraph, widget: text, i18n: true }
              - name: image
                label: Team photo
                widget: image
                i18n: duplicate
              - { name: imageAlt, label: Photo description, widget: string, i18n: true }

          - name: pitch
            label: 9. The three "See Our Works" panels
            widget: object
            i18n: true
            collapsed: true
            description: >-
              Three full-width panels. All three links go to the same Our Works
              gallery further down the page.
            fields:
              - { name: houseTitle, label: "Panel 1 heading (houses)", widget: string, i18n: true, required: true }
              - { name: houseSubtitle, label: "Panel 1 line under the heading", widget: text, i18n: true }
              - { name: houseCta, label: "Panel 1 link text", widget: string, i18n: true, required: true }
              - { name: houseImage, label: "Panel 1 background photo", widget: image, i18n: duplicate }
              - { name: houseImageAlt, label: "Panel 1 photo description", widget: string, i18n: true }
              - { name: officeTitle, label: "Panel 2 heading (offices)", widget: string, i18n: true, required: true }
              - { name: officeSubtitle, label: "Panel 2 line under the heading", widget: text, i18n: true }
              - { name: officeCta, label: "Panel 2 link text", widget: string, i18n: true, required: true }
              - { name: officeImage, label: "Panel 2 background photo", widget: image, i18n: duplicate }
              - { name: officeImageAlt, label: "Panel 2 photo description", widget: string, i18n: true }
              - { name: roadTitle, label: "Panel 3 heading (roads)", widget: string, i18n: true, required: true }
              - { name: roadSubtitle, label: "Panel 3 line under the heading", widget: text, i18n: true }
              - { name: roadCta, label: "Panel 3 link text", widget: string, i18n: true, required: true }
              - { name: roadImage, label: "Panel 3 background photo", widget: image, i18n: duplicate }
              - { name: roadImageAlt, label: "Panel 3 photo description", widget: string, i18n: true }

          - name: works
            label: 10. Our Works heading & filters
            widget: object
            i18n: true
            collapsed: true
            description: >-
              Button text only. Which projects each button shows is set by the
              Category field on each Our Works entry.
            fields:
              - { name: kicker, label: Small label above the heading, widget: string, i18n: true }
              - { name: title, label: Section heading, widget: text, i18n: true, required: true }
              - { name: filterAll, label: "Button: show everything", widget: string, i18n: true, required: true }
              - { name: filterHouse, label: "Button: houses", widget: string, i18n: true, required: true }
              - { name: filterOffice, label: "Button: offices", widget: string, i18n: true, required: true }
              - { name: filterRoad, label: "Button: roads", widget: string, i18n: true, required: true }

          - name: contact
            label: 11. Contact
            widget: object
            i18n: true
            collapsed: true
            description: >-
              The phone numbers and links here also drive the footer and the
              floating buttons on the right edge of the page.
            fields:
              - { name: kicker, label: Small label above the heading, widget: string, i18n: true }
              - { name: title, label: Section heading, widget: text, i18n: true, required: true }
              - { name: phoneLabel, label: "Caption above phone 1", widget: string, i18n: true }
              - name: phone1
                label: Phone number 1
                widget: string
                i18n: duplicate
                hint: Becomes a tap-to-call link. Also used in the footer and side buttons.
              - { name: phoneLabel2, label: "Caption above phone 2", widget: string, i18n: true }
              - { name: phone2, label: Phone number 2, widget: string, i18n: duplicate }
              - { name: lineLabel, label: "Caption above the LINE id", widget: string, i18n: true }
              - { name: lineId, label: LINE id, widget: string, i18n: duplicate }
              - name: lineUrl
                label: LINE chat link
                widget: string
                i18n: duplicate
                hint: 'Full URL, e.g. https://line.me/R/ti/p/~@yourid'
              - { name: fbLabel, label: "Caption above the Facebook name", widget: string, i18n: true }
              - { name: fbName, label: Facebook page name, widget: string, i18n: true }
              - { name: fbUrl, label: Facebook page link, widget: string, i18n: duplicate }
              - { name: officeTitle, label: Office block heading, widget: string, i18n: true, required: true }
              - { name: address, label: Address, widget: text, i18n: true }
              - { name: directions, label: Written directions, widget: text, i18n: true }
              - name: mapEmbed
                label: Google Map embed link
                widget: string
                i18n: duplicate
                hint: >-
                  In Google Maps choose Share, Embed a map, and copy only the
                  address inside src="...".
              - { name: quoteCta, label: Orange button in this section, widget: string, i18n: true }

          - name: quote
            label: 12. Quotation form wording
            widget: object
            i18n: true
            collapsed: true
            description: >-
              The labels inside the pop-up quotation form. Where the answers are
              sent is set under "Quotation form delivery" below.
            fields:
              - { name: title, label: Form heading, widget: string, i18n: true, required: true }
              - name: subtitle
                label: Line under the company name
                widget: string
                i18n: true
                hint: Shown small in the document header. Address and phone works well.
              - { name: docLabel, label: Document label (top right), widget: string, i18n: true }
              - { name: refLabel, label: Reference number label, widget: string, i18n: true }
              - { name: nameLabel, label: "Field label: name", widget: string, i18n: true, required: true }
              - { name: productLabel, label: "Field label: product", widget: string, i18n: true, required: true }
              - { name: productPlaceholder, label: "Product dropdown placeholder", widget: string, i18n: true }
              - { name: quantityLabel, label: "Field label: quantity", widget: string, i18n: true, required: true }
              - { name: siteLabel, label: "Field label: construction site", widget: string, i18n: true, required: true }
              - { name: contactLabel, label: "Field label: contact", widget: string, i18n: true, required: true }
              - { name: submit, label: Submit button, widget: string, i18n: true, required: true }
              - { name: note, label: Small print beside the button, widget: text, i18n: true }
              - { name: successTitle, label: "After sending: heading", widget: string, i18n: true, required: true }
              - { name: successBody, label: "After sending: message", widget: text, i18n: true }
              - { name: close, label: Close button, widget: string, i18n: true }

          - name: quoteForm
            label: 13. Quotation form delivery (Google Form)
            widget: object
            i18n: true
            collapsed: true
            description: >-
              Where quotation requests are sent. The form on the page posts the
              answers into a Google Form. Until these are filled in, requests go
              nowhere. Step-by-step instructions are in CMS_SETUP.md.
            fields:
              - name: formId
                label: Google Form id
                widget: string
                i18n: duplicate
                hint: >-
                  The long code in the form address, between /d/e/ and /viewform.
              - name: entryName
                label: Field id for Name
                widget: string
                i18n: duplicate
                hint: >-
                  Open the live form, view the page source, and search for
                  "entry." — each question has one, like entry.123456789.
              - { name: entryProduct, label: Field id for Product, widget: string, i18n: duplicate }
              - { name: entryQuantity, label: Field id for Quantity, widget: string, i18n: duplicate }
              - { name: entrySite, label: Field id for Construction site, widget: string, i18n: duplicate }
              - { name: entryContact, label: Field id for Contact, widget: string, i18n: duplicate }

          - name: productsHero
            label: 14. Products page - opening panel
            widget: object
            i18n: true
            collapsed: true
            description: The full-screen image at the top of the Our Products page.
            fields:
              - { name: kicker, label: Small label above the heading, widget: string, i18n: true }
              - { name: title, label: Heading, widget: text, i18n: true, required: true }
              - { name: subtitle, label: Line under the heading, widget: text, i18n: true }
              - { name: cta, label: Link text, widget: string, i18n: true }
              - { name: image, label: Background photo, widget: image, i18n: duplicate }
              - { name: imageAlt, label: Photo description, widget: string, i18n: true }

          - name: quoteSection
            label: 15. Home page - quotation section heading
            widget: object
            i18n: true
            collapsed: true
            description: >-
              The heading above the quotation form on the home page. The form
              fields themselves are under "Quotation form wording".
            fields:
              - { name: kicker, label: Small label above the heading, widget: string, i18n: true }
              - { name: title, label: Section heading, widget: text, i18n: true, required: true }

          - name: projectDetail
            label: 16. Project detail heading
            widget: object
            i18n: true
            collapsed: true
            description: >-
              The carousel at the foot of the Our Project page. The project name
              shown there comes from the Our Works entry that was clicked.
            fields:
              - { name: kicker, label: Small label above the heading, widget: string, i18n: true }

          - name: nav
            label: Menu links
            widget: object
            i18n: true
            collapsed: true
            description: >-
              Text of the top menu. These scroll to sections on the page;
              renaming them here does not change where they go.
            fields:
              - { name: about, label: Link to About Us, widget: string, i18n: true, required: true }
              - { name: products, label: Link to Our Products, widget: string, i18n: true, required: true }
              - { name: projects, label: Link to Our Project, widget: string, i18n: true, required: true }
              - { name: contact, label: Link to Contact Us, widget: string, i18n: true, required: true }

          - name: footer
            label: Footer
            widget: object
            i18n: true
            collapsed: true
            fields:
              - { name: companyName, label: Company name, widget: string, i18n: true, required: true }
              - { name: slogan, label: Slogan, widget: string, i18n: true }
              - { name: contactHeading, label: "Heading above the contact links", widget: string, i18n: true }
              - { name: copy, label: Copyright line, widget: string, i18n: true }
              - { name: backTop, label: Back-to-top link, widget: string, i18n: true }

          - name: general
            label: Page settings
            widget: object
            i18n: true
            collapsed: true
            fields:
              - name: pageTitle
                label: Browser tab title
                widget: string
                i18n: true
                required: true
                hint: Shown on the browser tab and in search results.
              - name: pageTitleAbout
                label: Browser tab title - About Us page
                widget: string
                i18n: true
                required: true
              - name: pageTitleProducts
                label: Browser tab title - Our Products page
                widget: string
                i18n: true
                required: true
              - name: pageTitleProjects
                label: Browser tab title - Our Project page
                widget: string
                i18n: true
                required: true
              - name: pageTitleContact
                label: Browser tab title - Contact Us page
                widget: string
                i18n: true
                required: true
              - name: metaDescription
                label: Search result description
                widget: text
                i18n: true
                hint: About one or two sentences. Shown under the title in Google.
              - { name: brandName, label: Company name beside the SC logo, widget: string, i18n: true, required: true }
              - { name: brandTagline, label: Small line under the company name, widget: string, i18n: true }
              - name: quoteCta
                label: Floating orange button
                widget: string
                i18n: true
                required: true
                hint: The button pinned to the bottom-left corner on every screen.

  # Kept as plain lists with explicit _th/_en/_zh fields. Decap's i18n ties list
  # length to the default locale, which makes adding and reordering items
  # fragile; explicit suffixed fields stay predictable.
  - name: products
    label: Products
    label_singular: Product
    icon: category
    editor: { preview: false }
    files:
      - name: list
        label: Product list
        file: content/products.json
        description: >-
          The six concrete products. These fill the product grid, the detail
          section for each product, and the dropdown in the quotation form.
        fields:
          - name: products
            label: Products
            label_singular: Product
            widget: list
            collapsed: true
            summary: "{{fields.order}}. {{fields.title_en}} ({{fields.unit}})"
            fields:
              - name: order
                label: Sort order
                widget: number
                value_type: int
                default: 1
                hint: Lower numbers appear first in the grid.
              - name: anchor
                label: Page anchor
                widget: select
                default: readymix
                options: [readymix, slab, pile, pipe, manhole, beam]
                hint: >-
                  Which detail section on the page this card links to. Do not
                  change this unless the page markup changes too.
              - name: unit
                label: Quantity unit
                widget: string
                default: pcs
                hint: >-
                  Shown next to Quantity in the quotation form when a customer
                  picks this product, e.g. m³ or pcs.
              - name: image
                label: Die-cut photo
                widget: image
                required: true
                hint: >-
                  The product on a transparent background, no backdrop. About
                  1000px across, under 500KB.
              - name: title_th
                label: Name - Thai
                widget: string
                required: true
              - { name: title_en, label: Name - English, widget: string, required: true }
              - { name: title_zh, label: Name - Chinese, widget: string, required: true }
              - name: tagline_th
                label: Small label - Thai
                widget: string
                hint: The short line above the product name in its detail section.
              - { name: tagline_en, label: Small label - English, widget: string }
              - { name: tagline_zh, label: Small label - Chinese, widget: string }
              - name: body_th
                label: Description - Thai
                widget: text
                hint: One short paragraph in the product's detail section.
              - { name: body_en, label: Description - English, widget: text }
              - { name: body_zh, label: Description - Chinese, widget: text }
              - name: spec_th
                label: Specification line - Thai
                widget: string
                hint: Sizes, strengths, how it is sold. Shown small under the description.
              - { name: spec_en, label: Specification line - English, widget: string }
              - { name: spec_zh, label: Specification line - Chinese, widget: string }
              - name: alt_th
                label: Photo description - Thai
                widget: string
                hint: Describes the photo for screen readers. Not shown on the page.
              - { name: alt_en, label: Photo description - English, widget: string }
              - { name: alt_zh, label: Photo description - Chinese, widget: string }

  - name: projects
    label: Our Works
    label_singular: Project
    icon: photo_library
    editor: { preview: false }
    files:
      - name: list
        label: Project cards
        file: content/projects.json
        description: >-
          Completed projects. These fill the Our Works gallery and the sliding
          strip near the top of the page.
        fields:
          - name: projects
            label: Projects
            label_singular: Project
            widget: list
            collapsed: true
            summary: "{{fields.order}}. {{fields.title_en}} ({{fields.category}})"
            fields:
              - name: order
                label: Sort order
                widget: number
                value_type: int
                default: 1
                hint: Lower numbers appear first.
              - name: category
                label: Category
                widget: select
                default: house
                options:
                  - { label: Houses, value: house }
                  - { label: Offices, value: office }
                  - { label: Roads, value: road }
                hint: Decides which filter button shows this card.
              - name: image
                label: Photo
                widget: image
                required: true
                hint: About 1000px across. Keep under 500KB so the page loads fast.
              - name: title_th
                label: Project name - Thai
                widget: string
                required: true
              - { name: title_en, label: Project name - English, widget: string, required: true }
              - { name: title_zh, label: Project name - Chinese, widget: string, required: true }
              - name: label_th
                label: Small label - Thai
                widget: string
                hint: The line above the name, e.g. "Private residence".
              - { name: label_en, label: Small label - English, widget: string }
              - { name: label_zh, label: Small label - Chinese, widget: string }
              - name: description_th
                label: Description - Thai
                widget: string
                hint: One line describing what the work involved.
              - { name: description_en, label: Description - English, widget: string }
              - { name: description_zh, label: Description - Chinese, widget: string }
              - name: alt_th
                label: Photo description - Thai
                widget: string
                hint: Describes the photo for screen readers. Not shown on the page.
              - { name: alt_en, label: Photo description - English, widget: string }
              - { name: alt_zh, label: Photo description - Chinese, widget: string }
